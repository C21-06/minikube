apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-app-dev
  namespace: dev
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: nginx-dev-app
  template:
      metadata:
        labels:
          app: nginx-dev-app
      spec:
        containers:
        - name: nginx
          image: nginx:1.25
          ports:
          - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"  
            limits:
              cpu: "250m"
              memory: "256Mi"
